<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087fa5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CV Instal">
  <title>CV Instal</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#16313c}
    body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
    main{width:min(420px,100%);text-align:center}
    img{width:150px;height:150px;object-fit:contain;border-radius:28px}
    h1{margin:18px 0 6px;font-size:28px}
    p{line-height:1.45;color:#526a74}
    .spinner{width:34px;height:34px;border:4px solid #d9e7ec;border-top-color:#087fa5;border-radius:50%;
      margin:22px auto;animation:spin .8s linear infinite}
    a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;background:#087fa5;color:#fff;
      text-decoration:none;font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main>
  <img src="./icon-192.png" alt="CV Instal">
  <h1>CV Instal</h1>
  <p>De app wordt geopend…</p>
  <div class="spinner" aria-hidden="true"></div>
  <a href="https://script.google.com/macros/s/AKfycbzssS9v4dEV0YjuRFiN80njmF06FUV2gSlRGnQgUy03pz_n9KYflYbH-J3xxqpO-fnJCQ/exec">Open CV Instal</a>
</main>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  setTimeout(() => window.location.replace("https://script.google.com/macros/s/AKfycbzssS9v4dEV0YjuRFiN80njmF06FUV2gSlRGnQgUy03pz_n9KYflYbH-J3xxqpO-fnJCQ/exec"), 450);
</script>
</body>
</html>
