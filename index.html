<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087fa5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CV Instal">
  <title>CV Instal</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#16313c}
    body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
      padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
    main{width:min(420px,100%);text-align:center}
    img{width:160px;height:160px;object-fit:contain;border-radius:30px}
    h1{margin:18px 0 8px;font-size:30px}
    p{line-height:1.5;color:#526a74;margin:8px 0 22px}
    a{display:block;width:100%;padding:15px 18px;border-radius:14px;background:#087fa5;color:#fff;
      text-decoration:none;font-weight:700;font-size:17px}
    .hint{font-size:13px;margin-top:18px;color:#71858d}
  </style>
</head>
<body>
<main>
  <img src="./apple-touch-icon.png" alt="CV Instal">
  <h1>CV Instal</h1>
  <p>Urenregistratie, planning en werfopvolging.</p>
  <a href="https://script.google.com/macros/s/AKfycbzssS9v4dEV0YjuRFiN80njmF06FUV2gSlRGnQgUy03pz_n9KYflYbH-J3xxqpO-fnJCQ/exec">Open CV Instal Urenapp</a>
  <p class="hint">Installeer deze pagina eerst op je beginscherm. Open daarna de CV Instal urenapp via de knop hierboven.</p>
</main>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
